services:
  - type: web
    name: ecoblock-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && cd server && npm install
    startCommand: node app.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
